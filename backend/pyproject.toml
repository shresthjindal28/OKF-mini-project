[project]
name = "okf-builder-backend"
version = "0.1.0"
description = "Portable OKF v0.2 document builder and semantic index"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3.6,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "pypdf>=5.3,<7", "python-docx>=1.1.2,<2", "PyYAML>=6.0.2,<7",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "reportlab>=4.3,<5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL test database"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
